<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520">
  <defs>
    <style>
      .mode-circle { fill: #f8f4e8; stroke: #8b7355; stroke-width: 2; }
      .mode-label { font-family: Georgia, serif; font-size: 11px; fill: #2c1810; text-anchor: middle; }
      .mode-interval { font-family: monospace; font-size: 8px; fill: #666; text-anchor: middle; }
      .edge-1 { stroke: #4a7c59; stroke-width: 3; fill: none; }
      .edge-label { font-family: sans-serif; font-size: 10px; fill: #4a7c59; text-anchor: middle; font-weight: bold; }
      .title { font-family: Georgia, serif; font-size: 18px; fill: #2c1810; text-anchor: middle; font-weight: bold; }
      .subtitle { font-family: Georgia, serif; font-size: 12px; fill: #666; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="30" class="title">7-String Lyre Mode Retuning</text>

  <!-- Connections (drawn first, nodes will overlay endpoints) -->
  <!-- Using precise heptagon coordinates: center (300,260), radius 175 -->

  <!-- 0-1: Mixolydian to Dorian -->
  <line x1="300" y1="85" x2="437" y2="145" class="edge-1"/>
  <!-- 1-2: Dorian to Hypodorian -->
  <line x1="437" y1="145" x2="471" y2="295" class="edge-1"/>
  <!-- 2-3: Hypodorian to Phrygian -->
  <line x1="471" y1="295" x2="377" y2="410" class="edge-1"/>
  <!-- 3-4: Phrygian to Hypophrygian -->
  <line x1="377" y1="410" x2="223" y2="410" class="edge-1"/>
  <!-- 4-5: Hypophrygian to Lydian -->
  <line x1="223" y1="410" x2="129" y2="295" class="edge-1"/>
  <!-- 5-6: Lydian to Hypolydian -->
  <line x1="129" y1="295" x2="163" y2="145" class="edge-1"/>
  <!-- 6-0: Hypolydian to Mixolydian -->
  <line x1="163" y1="145" x2="300" y2="85" class="edge-1"/>

  <!-- Edge labels -->
  <rect x="356" y="100" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="371" y="111" class="edge-label">str 5</text>

  <rect x="448" y="208" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="463" y="219" class="edge-label">str 2</text>

  <rect x="412" y="340" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="427" y="351" class="edge-label">str 6</text>

  <rect x="285" y="418" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="300" y="429" class="edge-label">str 3</text>

  <rect x="158" y="340" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="173" y="351" class="edge-label">str 7</text>

  <rect x="122" y="208" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="137" y="219" class="edge-label">str 4</text>

  <rect x="214" y="100" width="30" height="16" rx="3" fill="white" stroke="#4a7c59" stroke-width="1"/>
  <text x="229" y="111" class="edge-label">str 1</text>

  <!-- Mode nodes (regular heptagon) -->
  <!-- 0: Mixolydian - top -->
  <ellipse cx="300" cy="85" rx="50" ry="28" class="mode-circle"/>
  <text x="300" y="82" class="mode-label">Mixolydian</text>
  <text x="300" y="94" class="mode-interval">H W W H W W W</text>

  <!-- 1: Dorian -->
  <ellipse cx="437" cy="145" rx="50" ry="28" class="mode-circle"/>
  <text x="437" y="142" class="mode-label">Dorian</text>
  <text x="437" y="154" class="mode-interval">H W W W H W W</text>

  <!-- 2: Hypodorian -->
  <ellipse cx="471" cy="295" rx="50" ry="28" class="mode-circle"/>
  <text x="471" y="292" class="mode-label">Hypodorian</text>
  <text x="471" y="304" class="mode-interval">W H W W H W W</text>

  <!-- 3: Phrygian -->
  <ellipse cx="377" cy="410" rx="50" ry="28" class="mode-circle"/>
  <text x="377" y="407" class="mode-label">Phrygian</text>
  <text x="377" y="419" class="mode-interval">W H W W W H W</text>

  <!-- 4: Hypophrygian -->
  <ellipse cx="223" cy="410" rx="50" ry="28" class="mode-circle"/>
  <text x="223" y="407" class="mode-label">Hypophrygian</text>
  <text x="223" y="419" class="mode-interval">W W H W W H W</text>

  <!-- 5: Lydian -->
  <ellipse cx="129" cy="295" rx="50" ry="28" class="mode-circle"/>
  <text x="129" y="292" class="mode-label">Lydian</text>
  <text x="129" y="304" class="mode-interval">W W H W W W H</text>

  <!-- 6: Hypolydian -->
  <ellipse cx="163" cy="145" rx="50" ry="28" class="mode-circle"/>
  <text x="163" y="142" class="mode-label">Hypolydian</text>
  <text x="163" y="154" class="mode-interval">W W W H W W H</text>

  <!-- Direction arrows in center (concentric) -->
  <defs>
    <marker id="arrow-raise" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#4a7c59"/>
    </marker>
    <marker id="arrow-lower" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#8b4513"/>
    </marker>
  </defs>

  <!-- Outer clockwise arrow (raise) - centered at (300, 260) -->
  <path d="M 332 216 A 55 55 0 1 1 268 216" fill="none" stroke="#4a7c59" stroke-width="3" marker-end="url(#arrow-raise)"/>
  <text x="300" y="220" style="font-family: Georgia, serif; font-size: 12px; fill: #4a7c59; text-anchor: middle; font-weight: bold;">raise</text>

  <!-- Inner counter-clockwise arrow (lower) - centered at (300, 260) -->
  <path d="M 315 280 A 25 25 0 1 0 285 280" fill="none" stroke="#8b4513" stroke-width="3" marker-end="url(#arrow-lower)"/>
  <text x="300" y="265" style="font-family: Georgia, serif; font-size: 12px; fill: #8b4513; text-anchor: middle; font-weight: bold;">lower</text>

  <!-- Footer -->
  <text x="300" y="480" class="subtitle">The 7 modes form a cycle where each step requires retuning exactly 1 string</text>
</svg>
